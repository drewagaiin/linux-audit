# Registro de riesgos aceptados de linux-audit
#
# Copia este archivo a /etc/linux-audit/exceptions.conf (se carga solo) o usa
#   sudo ./audit.sh --exceptions archivo.conf
#
# Formato: un control por línea →  ID  motivo (quién lo aprobó y por qué)
# Los hallazgos aceptados se muestran como ACEPTADO, con el motivo, y no
# restan puntos. Así el informe distingue "no lo sabíamos" de "lo decidimos".
#
# SEGURIDAD: al ejecutar como root, el archivo debe pertenecer a root y no ser
# modificable por otros usuarios. Si no, se ignora y se reporta (SYS-004),
# porque podría usarse para ocultar una intrusión.
#   sudo chown root:root /etc/linux-audit/exceptions.conf
#   sudo chmod 644 /etc/linux-audit/exceptions.conf

# Ejemplos (descomenta y adapta):
# ACC-007  Política corporativa: contraseñas sin caducidad (NIST 800-63B). Aprobado por CISO, 2026-10.
# ACC-009  Regla NOPASSWD de OpenVAS/GVM necesaria para el escáner. Revisión anual.
# SVC-006  Equipo de pentest: los clientes telnet/ftp son herramientas de trabajo.
# KRN-009  Host de Docker: ip_forward es necesario para la red de contenedores.
